[build]
  command = "npm run build"
  publish = "dist/spa"

[build.environment]
  # @quasar/app-vite v3 requires Node >= 22.12
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps=false"

# The app uses Vue Router "history" mode, so every deep link must be
# served the SPA entry point instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
